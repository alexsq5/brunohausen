const cv=document.getElementById('c'),ctx=cv.getContext('2d'),W=1080,H=1920;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),sm=x=>{x=clamp(x,0,1);return x*x*(3-2*x)},lerp=(a,b,k)=>a+(b-a)*k,easeOut=x=>1-Math.pow(1-clamp(x,0,1),3);

const MOTES=[...Array(50)].map(()=>({x:R()*W,y:R()*H,s:2+R()*5,p:R()*6,v:12+R()*25}));
function bg(name,t,u,{z0=1.05,z1=1.15,x0=0,x1=0,y0=0,y1=0}={}){const im=IM[name];const z=lerp(z0,z1,u);const s=Math.max(W/im.width,H/im.height)*z;
 const w=im.width*s,h=im.height*s;const cx=W/2+lerp(x0,x1,u),cy=H/2+lerp(y0,y1,u);ctx.drawImage(im,cx-w/2,cy-h/2,w,h);GT={ox:cx-w/2,oy:cy-h/2,s,im};}
function fig(name,x,y,h0,{t=0,breath=1,flip=false,rot=0,sq=1,alpha=1}={}){const h=Math.max(1,h0);const im=IM[name];const s=h/im.height;const w=im.width*s;
